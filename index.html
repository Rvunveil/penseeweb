  :root{
    --navy:#0B1F3A;
    --navy-2:#132B4D;
    --white:#FFFFFF;
    --grey-50:#F6F7F9;
    --grey-100:#EDEFF3;
    --grey-200:#E1E4EA;
    --grey-400:#9AA3B2;
    --grey-600:#5B6474;
    --ink:#101827;
    --accent:#E3B23C;
    --green:#1E9E6B;
    --green-bg:#E8F6EF;
    --amber:#D98C2B;
    --amber-bg:#FCF1DF;
    --red:#D14343;
    --red-bg:#FBE9E9;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,39,0.04), 0 8px 24px rgba(16,24,39,0.06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font); background:var(--grey-50); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;}
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  #app{min-height:100vh;}
  .hidden{display:none !important;}

  /* ---------- top nav (app shell) ---------- */
  .topnav{
    position:sticky; top:0; z-index:40;
    background:var(--navy); color:white;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; height:60px;
  }
  .topnav .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:0.3px; font-size:16px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent);}
  .topnav nav{display:flex; gap:26px; font-size:13.5px; color:#C9D2E3;}
  .topnav nav a.active, .topnav nav a:hover{color:white;}
  .topnav .navstat{display:flex; align-items:center; gap:14px;}
  .badge-demo{background:rgba(227,178,60,0.16); color:var(--accent); font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:0.4px;}
  .profile-dot{width:30px; height:30px; border-radius:50%; background:#1E3A63; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#C9D2E3;}

  .shell{max-width:1180px; margin:0 auto; padding:32px 28px 80px;}
  .shell-narrow{max-width:880px;}

  /* ---------- landing ---------- */
  .landing-hero{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color:white; padding:64px 28px 0; text-align:center; position:relative; overflow:hidden;
  }
  .landing-hero .tagline{color:var(--accent); font-size:13px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:18px;}
  .landing-hero h1{font-size:44px; font-weight:800; line-height:1.15; max-width:720px; margin:0 auto 18px;}
  .landing-hero p.sub{color:#B9C4D9; max-width:520px; margin:0 auto 30px; font-size:16px;}
  .hero-ctas{display:flex; gap:14px; justify-content:center; margin-bottom:56px;}
  .btn{border:none; border-radius:10px; padding:13px 24px; font-size:14.5px; font-weight:600; transition:all .15s ease;}
  .btn-primary{background:var(--accent); color:var(--navy);}
  .btn-primary:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .btn-secondary{background:rgba(255,255,255,0.08); color:white; border:1px solid rgba(255,255,255,0.22);}
  .btn-secondary:hover{background:rgba(255,255,255,0.14);}
  .btn-ghost{background:transparent; color:var(--navy); border:1px solid var(--grey-200);}
  .btn-ghost:hover{background:var(--grey-100);}
  .btn-sm{padding:8px 14px; font-size:13px; border-radius:8px;}
  .btn-block{width:100%;}
  .btn-danger-outline{background:white; border:1px solid var(--red); color:var(--red);}

  .stage-strip{
    display:flex; align-items:center; justify-content:center; gap:0; max-width:720px; margin:0 auto;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px 16px 0 0; padding:22px 30px 26px;
  }
  .stage-item{display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; position:relative;}
  .stage-item .circle{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.28); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#DCE3EF;}
  .stage-item.done .circle{background:var(--accent); border-color:var(--accent); color:var(--navy);}
  .stage-item .lbl{font-size:11.5px; color:#B9C4D9; font-weight:600; letter-spacing:0.4px;}
  .stage-line{position:absolute; top:17px; left:50%; width:100%; height:1.5px; background:rgba(255,255,255,0.18); z-index:0;}
  .stage-item:last-child .stage-line{display:none;}

  .landing-body{background:white; max-width:720px; margin:0 auto; border-radius:0 0 16px 16px; padding:26px 30px 30px; box-shadow:var(--shadow);}
  .landing-body .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:6px;}
  .mini-stat{padding:14px; border:1px solid var(--grey-200); border-radius:10px;}
  .mini-stat .n{font-size:20px; font-weight:800; color:var(--navy);}
  .mini-stat .l{font-size:12px; color:var(--grey-600); margin-top:2px;}

  .section{padding:60px 28px; max-width:1180px; margin:0 auto;}
  .section h2{font-size:24px; font-weight:800; margin-bottom:8px; color:var(--navy);}
  .section p.lead{color:var(--grey-600); max-width:640px; margin-bottom:30px; font-size:15px;}

  .demo-props{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .prop-card{background:white; border:1px solid var(--grey-200); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;}
  .prop-card:hover{transform:translateY(-3px); box-shadow:0 4px 10px rgba(16,24,39,0.08), 0 14px 30px rgba(16,24,39,0.1);}
  .prop-card .tag{font-size:11px; font-weight:700; color:var(--grey-600); text-transform:uppercase; letter-spacing:0.5px;}
  .prop-card h3{font-size:17px; margin:8px 0 2px; color:var(--navy);}
  .prop-card .loc{font-size:13px; color:var(--grey-600); margin-bottom:14px;}
  .prop-card .row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--grey-600);}
  .prop-card .row b{color:var(--ink); font-weight:600;}
  .score-pill{display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:13px; padding:5px 11px; border-radius:20px; margin-top:12px;}
  .score-pill.good{background:var(--green-bg); color:var(--green);}
  .score-pill.warn{background:var(--amber-bg); color:var(--amber);}
  .score-pill.bad{background:var(--red-bg); color:var(--red);}

  /* before/after */
  .ba-wrap{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .ba-card{border-radius:var(--radius); padding:22px; border:1px solid var(--grey-200); background:white;}
  .ba-card.old{border-top:4px solid var(--grey-400);}
  .ba-card.new{border-top:4px solid var(--accent);}
  .ba-card h4{font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--grey-600); margin-bottom:14px;}
  .ba-flow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px;}
  .ba-node{background:var(--grey-100); font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:8px; color:var(--ink);}
  .ba-card.new .ba-node{background:rgba(227,178,60,0.14); color:var(--navy);}
  .ba-quote{font-size:14.5px; font-style:italic; color:var(--ink); border-left:3px solid var(--grey-300,#ccc); padding-left:12px;}
  .ba-card.new .ba-quote{border-left-color:var(--accent);}

  /* ---------- intake ---------- */
  .page-head{margin-bottom:26px;}
  .page-head .eyebrow{font-size:12px; font-weight:700; color:var(--accent2, var(--amber)); text-transform:uppercase; letter-spacing:0.6px; color:#B08324; margin-bottom:6px;}
  .page-head h1{font-size:26px; font-weight:800; color:var(--navy);}
  .page-head p{color:var(--grey-600); margin-top:6px; font-size:14.5px;}

  .progress-track{display:flex; gap:6px; margin-bottom:30px;}
  .progress-track .seg{height:5px; flex:1; border-radius:3px; background:var(--grey-200);}
  .progress-track .seg.on{background:var(--accent);}

  .card{background:white; border:1px solid var(--grey-200); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-pad{padding:26px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12.5px; font-weight:700; color:var(--grey-600);}
  .field input, .field select{padding:11px 13px; border:1px solid var(--grey-200); border-radius:9px; font-size:14px; background:var(--grey-50); color:var(--ink);}
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent); background:white;}
  .chip-row{display:flex; gap:10px; flex-wrap:wrap;}
  .chip{border:1px solid var(--grey-200); background:white; padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--grey-600);}
  .chip.on{border-color:var(--navy); background:var(--navy); color:white;}
  .intake-footer{display:flex; justify-content:space-between; align-items:center; margin-top:24px;}
  .intake-summary{font-size:13px; color:var(--grey-600);}
  .intake-summary b{color:var(--ink);}

  .ai-note{display:flex; gap:12px; align-items:flex-start; background:var(--navy); color:white; border-radius:12px; padding:16px 18px; margin-top:22px;}
  .ai-note .ico{font-size:16px;}
  .ai-note .t{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:0.4px; text-transform:uppercase; margin-bottom:3px;}
  .ai-note p{font-size:13.5px; color:#DCE3EF;}

  /* ---------- documents ---------- */
  .doc-note{font-size:13px; color:var(--grey-600); background:var(--grey-100); padding:10px 14px; border-radius:9px; margin-bottom:22px;}
  .doc-section{margin-bottom:22px;}
  .doc-section h3{font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--grey-600); margin-bottom:10px; font-weight:700;}
  .doc-item{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border:1px solid var(--grey-200); border-radius:10px; background:white; margin-bottom:8px; cursor:pointer; transition:border-color .12s;}
  .doc-item:hover{border-color:var(--navy);}
  .doc-item .left{display:flex; align-items:center; gap:12px;}
  .doc-status-ic{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;}
  .doc-status-ic.verified{background:var(--green-bg); color:var(--green);}
  .doc-status-ic.review{background:var(--amber-bg); color:var(--amber);}
  .doc-status-ic.missing{background:var(--red-bg); color:var(--red);}
  .doc-status-ic.pro{background:var(--grey-200); color:var(--grey-600);}
  .doc-item .name{font-size:14.5px; font-weight:600;}
  .doc-item .status-lbl{font-size:12px; color:var(--grey-600);}
  .doc-item .chev{color:var(--grey-400); font-size:14px;}

  /* ---------- score screen ---------- */
  .score-hero{display:grid; grid-template-columns:280px 1fr; gap:36px; align-items:center;}

<script>
/* ============================= DATA ============================= */
const PROPERTIES = {

  p3: { id:'p3', name:'Brigade Metropolis', location:'Mahadevapura, Bengaluru', value:'₹1.72 Cr', valueNum:17200000, type:'Resale', financing:'Home loan', unit:'A-1508', age:'11 years', possession:'Ready to move', baseScore:64,
    dims:{ title:78, documentation:60, municipal:55, association:40, financing:70, registration:62 } },
};

const DOC_SECTIONS = [
  { name:'PROPERTY', items:[
    { id:'saledeed', name:'Sale deed', status:'verified', what:'Confirms legal ownership transfer history of the property.', why:'Forms the primary legal basis for the current transaction and future registration.', next:'No action needed — already verified.' },
    { id:'title', name:'Previous title documents', status:'verified', what:'Establishes the chain of ownership before the current seller.', why:'Gaps in the title chain can create disputes after purchase.', next:'No action needed — already verified.' },
    { id:'ec', name:'Encumbrance Certificate', status:'review', what:'Confirms the property is free of registered loans or legal claims.', why:'An unresolved encumbrance can block loan disbursement or registration.', next:'Awaiting the latest EC copy from the sub-registrar office.' },
    { id:'khata', name:'Khata / e-Khata documentation', status:'missing', what:'Municipal record used for property tax assessment and, in many cases, registration eligibility.', why:'Bank-specific requirement — many lenders require a valid Khata before disbursing a loan.', next:'Request the current e-Khata extract from the seller.' },
    { id:'tax', name:'Property tax records', status:'verified', what:'Shows tax payment history for the unit.', why:'Outstanding dues can delay handover and registration.', next:'No action needed — already verified.' },
  ]},
  { name:'SOCIETY / ASSOCIATION', items:[
    { id:'assocnoc', name:'Association clearance / NOC', status:'missing', what:'Confirms the apartment association has no objection to the ownership transfer.', why:'Case-specific — some associations require a formal NOC before updating member records.', next:'Request NOC from the seller / association office.' },
    { id:'maintdues', name:'Maintenance dues status', status:'review', what:'Confirms there are no pending maintenance dues on the unit.', why:'Outstanding dues are commonly settled at registration and can affect final payout.', next:'Awaiting latest dues statement from the association.' },
    { id:'transferdoc', name:'Association transfer documentation', status:'missing', what:'Internal association paperwork to register the new owner.', why:'Required by many associations before utility and access transfers.', next:'To be initiated once NOC is received.' },
  ]},
  { name:'FINANCING', items:[
    { id:'sanction', name:'Loan sanction letter', status:'verified', what:'Confirms the bank has approved the loan amount in principle.', why:'Needed before the bank proceeds with property-level document checks.', next:'No action needed — already verified.' },
    { id:'bankdocs', name:'Bank-required property documents', status:'review', what:'Set of documents the lender needs to legally value and secure the property.', why:'Bank-specific requirement — this list varies by lender and property type.', next:'Bank is currently reviewing the submitted document set.' },
    { id:'valuation', name:'Property valuation report', status:'verified', what:'Independent valuation used by the bank to determine loan eligibility.', why:'Determines final loan-to-value ratio for disbursement.', next:'No action needed — already verified.' },
  ]},
  { name:'SELLER', items:[
    { id:'sellerid', name:'Seller identity documentation', status:'verified', what:'Confirms the identity of the person(s) selling the property.', why:'Required to ensure the transacting party matches ownership records.', next:'No action needed — already verified.' },
    { id:'ownership', name:'Ownership proof', status:'verified', what:'Independent confirmation that the seller legally owns the unit.', why:'Reduces risk of transacting with an unauthorised party.', next:'No action needed — already verified.' },
    { id:'sellertax', name:'Tax-related information', status:'pro', what:'TDS and capital-gains related information relevant to the sale.', why:'Tax treatment can vary by seller residency status and transaction value.', next:'Professional review recommended before final payment.' },
  ]},
  { name:'OTHER', items:[
    { id:'poa', name:'Power of Attorney', status:'pro', what:'Confirms authority where a representative is acting on behalf of an owner.', why:'Case-specific — only relevant if the seller is not personally executing documents.', next:'Professional review recommended to confirm validity and scope.' },
  ]},
];

const BLOCKERS_TEMPLATE = [
  { id:'assoc', title:'Association Clearance', priority:'high',
    impact:'May delay financing / transaction completion depending on lender and association requirements.',
    detected:'Required documentation / clearance has not yet been uploaded.',
    next:'Request documentation from seller / association.',
    owner:'Seller / Association',
    why:'Your bank / transaction workflow may require association clearance before proceeding. Resolving this early can reduce the risk of discovering the issue after commercial terms have already been agreed.',
    action:'Start Resolution' },
  { id:'ekhata', title:'e-Khata / Municipal Record', priority:'medium',
    impact:'May affect registration eligibility depending on jurisdiction and lender policy.',
    detected:'Verification of the current municipal record has not been completed.',
    next:'Validate the available municipal property record.',
    owner:'Buyer (with municipal office)',
    why:'Many lenders and sub-registrar offices reference the Khata record during registration. An unverified record can surface late in the process, when it is more expensive to fix.',
    action:'Request Verification' },
  { id:'maintdues2', title:'Maintenance Dues Confirmation', priority:'medium',
    impact:'Case-specific — unresolved dues are typically settled at registration.',
    detected:'Latest dues statement from the association is awaited.',
    next:'Request a no-dues statement from the association.',
    owner:'Seller / Association',
    why:'Outstanding dues can be adjusted into the final settlement. Confirming this early avoids last-minute negotiation at registration.',
    action:'Request Verification' },
  { id:'tds', title:'Seller Tax / TDS Review', priority:'medium',
    impact:'Case-specific — depends on seller residency and transaction value.',
    detected:'Tax-related information has not yet been reviewed by a professional.',
    next:'Route seller tax information for professional review.',
    owner:'Buyer, with professional advisor',
    why:'TDS obligations vary by seller profile. A professional review reduces the risk of compliance issues after payment is made.',
    action:'Review With Lawyer' },
];

const CT_STAGES = [
  { id:'agreed', name:'Deal Agreed', status:'done', owner:'Buyer & Seller', desc:'Commercial terms agreed by both parties.' },
  { id:'diligence', name:'Due Diligence', status:'done', owner:'RELAI Transfer-Clear', desc:'Initial document and title review completed.' },
  { id:'docs', name:'Documentation', status:'progress', owner:'Seller / RELAI', desc:'e-Khata and select documents still under verification.' },
  { id:'assoc', name:'Association Clearance', status:'blocked', owner:'Seller / Association', desc:'NOC and dues confirmation pending — high priority blocker.' },
  { id:'financing', name:'Financing', status:'progress', owner:'Buyer / Bank', desc:'Bank reviewing submitted property documents.' },
  { id:'regready', name:'Registration Readiness', status:'pending', owner:'RELAI Transfer-Clear', desc:'Will begin once documentation and association stages clear.' },
  { id:'registration', name:'Registration', status:'pending', owner:'Buyer & Seller', desc:'Final step at the sub-registrar office.' },
];

/* ============================= STATE ============================= */
const state = {
  view: 'landing',
  propertyId: 'p1',
  nriMode: false,
  intakeStep: 0,
  intakeData: { propertyType:'Apartment', location:'Whitefield, Bengaluru', value:'₹1.45 Cr', project:'Prestige Lakeside Habitat', unit:'B-1204', buyerType:'Individual', sellerType:'Individual', loan:'Yes', nri:'No', age:'8 years', possession:'Ready to move' },
  docs: {}, // id -> status override
  blockers: {}, // id -> 'open' | 'resolved'
  dims: {}, // property dims override
  activeBlockerDetail: null,
  activeDoc: null,
  actionCentre: null, // blocker id
  actionCentreOption: null,
  history: [],
};

function currentProperty(){ return PROPERTIES[state.propertyId]; }
function initPropertyState(pid){
  const p = PROPERTIES[pid];
  state.dims[pid] = { ...p.dims };
  state.blockers[pid] = {};
  BLOCKERS_TEMPLATE.forEach(b => { state.blockers[pid][b.id] = 'open'; });
  state.docs[pid] = {};
  DOC_SECTIONS.forEach(sec => sec.items.forEach(it => state.docs[pid][it.id] = it.status));
}
['p1','p2','p3'].forEach(initPropertyState);

function currentDims(){ return state.dims[state.propertyId]; }
function currentBlockerStatus(){ return state.blockers[state.propertyId]; }
function currentDocs(){ return state.docs[state.propertyId]; }

function computeScore(){
  const d = currentDims();
  const vals = Object.values(d);
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function scoreTone(score){
  if(score>=85) return 'good';
  if(score>=65) return 'warn';
  return 'bad';
}

function openBlockersCount(){
  const bs = currentBlockerStatus();
  return BLOCKERS_TEMPLATE.filter(b=>bs[b.id]==='open');
}
function countByPriority(pri){
  return openBlockersCount().filter(b=>b.priority===pri).length;
}

/* ============================= HELPERS ============================= */
function go(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);
  state.history.push(view);
  window.scrollTo(0,0);
  render();
}
function back(){
  state.history.pop();
  const prev = state.history[state.history.length-1] || 'landing';
  state.view = prev;
  render();
}
function toast(title, msg){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="ic">✓</div><div><b>${title}</b>${msg||''}</div>`;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4200);
}
function esc(s){ return (s||'').toString(); }

/* ============================= NAV SHELL ============================= */
function navHtml(){
  const p = currentProperty();
  const active = state.view;
  const isApp = active !== 'landing';

function renderScore(){
  const score = computeScore();
  const tone = scoreTone(score);
  const circumference = 2*Math.PI*100;
  const offset = circumference * (1 - score/100);
  const dims = currentDims();
  const highs = openBlockersCount().filter(b=>b.priority==='high');
  return `
  ${navHtml()}
  <div class="shell">

              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" style="transition:stroke-dashoffset 1s ease;"/>
          </svg>
          <div class="radial-center">
            <div class="num">${score}</div>
            <div class="of">/ 100</div>
            <div class="lbl">Transaction Readiness</div>

            <div class="dval" style="color:${dimColor(v)};">${v}</div>

    ${highs.length>0 ? `<div class="blocker-alert">
      <div>
        <div class="txt">${highs.length} high-priority blocker${highs.length>1?'s':''} detected</div>
        <div class="blocker-mini-list">
          ${openBlockersCount().slice(0,3).map(b=>`<div class="blocker-mini">${b.priority==='high'?'🔴':'🟠'} ${b.title}</div>`).join('')}

      <button class="btn btn-primary btn-sm" onclick="go('controltower')">View Control Tower</button>
    </div>`}

      <button class="btn btn-primary" onclick="go('blockers')">Continue to Blocker Detection →</button>
    </div>
  </div>
  `;
}

  closeActionCentre();
  if(!id){ go('resolution'); return; }
  const bs = currentBlockerStatus();
  bs[id] = 'resolved';
  const dims = currentDims();
  const bump = { assoc:'association', ekhata:'municipal', maintdues2:'association', tds:'documentation' }[id];
  const before = computeScore();
  if(bump && dims[bump] < 95){ dims[bump] = Math.min(98, dims[bump] + 22); }
  const after = computeScore();
  toast(`${BLOCKERS_TEMPLATE.find(b=>b.id===id).title} — resolution started`, `<br/>Transaction readiness increased ${before} → ${after}.`);
  go('resolution');
}

}

/* ============================= DEMO MODE ============================= */
function runDemoMode(){
  state.propertyId = 'p1';
  initPropertyState('p1');
  const seq = [
    ()=>go('score'),
    ()=>go('blockers'),
    ()=>openBlockerDetail('assoc'),
    ()=>{ closeBlockerDetail(); openActionCentre('assoc'); },
    ()=>{ selectActionOption('I want RELAI to review it'); },
    ()=>{ resolveBlocker('assoc'); },
    ()=>go('controltower'),
  ];
  let i=0;
  function step(){
    if(i>=seq.length) return;
    seq[i](); i++;
    setTimeout(step, 1900);
  }
  step();
}

/* ============================= MAIN RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.view){
    case 'landing': html = renderLanding(); break;
    case 'howitworks': html = renderHowItWorks(); break;
    case 'propertypicker': html = renderPropertyPicker(); break;
    case 'intake': html = renderIntake(); break;
    case 'documents': html = renderDocuments(); break;
    case 'score': html = renderScore(); break;
    case 'blockers': html = renderBlockers(); break;
    case 'resolution': html = renderResolution(); break;
    case 'controltower': html = renderControlTower(); break;
    case 'transferready': html = renderTransferReady(); break;
    case 'report': html = renderReport(); break;
    case 'pricing': html = renderPricing(); break;
    default: html = renderLanding();
  }
  app.innerHTML = html;
}
state.history.push('landing');
